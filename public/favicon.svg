<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- a boxed "S", the site's boxed-numeral motif. The paper fill keeps it
       readable on dark browser tabs too. -->
  <rect x="2" y="2" width="28" height="28" fill="#faf9f6" stroke="#141414" stroke-width="2"/>
  <text x="16" y="17" dominant-baseline="central" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="500" fill="#141414">S</text>
</svg>
